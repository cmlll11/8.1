protocol: MDL-FEATURE-v1
run_name: forward_feature_smoke
target_label: 0
classifier_seeds: [0]
trigger_ids: [badnets]

data:
  root: data/cifar10
  split_seed: 2026
  smoke_examples: 64
  smoke_train_examples: 2048
  smoke_validation_examples: 512
  smoke_test_examples: 1000
  pilot_examples: 1024
  exclude_target_class: true

classifier:
  architecture: cifar_resnet18
  epochs: 100
  smoke_epochs: 1
  batch_size: 128
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  amp: true

backdoor:
  trigger_id: badnets
  patch_size: 4
  patch_top: 28
  patch_left: 28
  patch_value: [1.0, 1.0, 1.0]
  poison_fraction: 0.10

targeted_uap:
  # Frozen validation-only ladder: select the smallest budget reaching the ASR gate.
  epsilon_candidates: [0.06274509803921569, 0.09411764705882353, 0.12549019607843137]
  restarts: 2
  epochs_per_epsilon: 30
  smoke_epochs: 1
  batch_size: 256
  learning_rate: 0.01
  confidence: 0.0
  cross_entropy_weight: 0.1
  success_patience: 2

qualification:
  minimum_clean_accuracy: 0.90
  minimum_backdoor_asr: 0.95
  maximum_clean_patch_asr: 0.10
  minimum_adversarial_asr: 0.90

layers:
  candidates: [stem, layer1.0, layer1, layer2, layer3]
  deep_negative_control: layer3

assets:
  models:
    clean: artifacts/models/clean/seed{seed}/attack_result.pt
    backdoor: artifacts/models/{trigger}/seed{seed}/attack_result.pt
  pairs:
    uap: artifacts/pairs/uap/seed{seed}.pt
    trigger: artifacts/pairs/{trigger}/seed{seed}.pt

observation:
  batch_size: 128
  summary_examples: 256
  similarity_examples: 128
  bootstrap_samples: 200
  auc_threshold: 0.80
  compression_ci_upper: 1.0
  minimum_source_asr: 0.90
  maximum_source_asr_gap: 0.05

fitting:
  levels: [C0, C1, C2, C3, C4]
  ranks: [1, 2, 4, 8]
  fit_seeds: [0, 1, 2]
  smoke_steps: 2
  short_steps: 250
  full_steps: 2000
  validation_interval: 25
  learning_rate: 0.001
  batch_size: 128
  pruning: [0.0, 0.5, 0.75, 0.9, 0.95]
  quantization: [fp32, int8, int4]
  nrmse_thresholds: [0.10, 0.20, 0.30]
  maximum_asr_gap: 0.05
